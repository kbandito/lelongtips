name: Scraper Diagnose

# Temporary: runs the site-markup diagnostic on every push to the fix branch,
# because the site can only be reached from a runner. Delete once the scraper
# extraction is fixed and verified.
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'src/diagnose.py'
      - 'src/monitor.py'
      - '.github/workflows/diagnose.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      # Only src/ — a full checkout drags in 778MB of snapshots and takes
      # longer than the diagnostic itself.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          playwright install chromium --with-deps
      - name: Diagnose
        env:
          LELONGTIPS_EMAIL: ${{ secrets.LELONGTIPS_EMAIL }}
          LELONGTIPS_PASSWORD: ${{ secrets.LELONGTIPS_PASSWORD }}
        run: python src/diagnose.py --pages 2 --dump-dir data/diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-html-${{ github.run_number }}
          path: data/diagnostics/
          retention-days: 7
