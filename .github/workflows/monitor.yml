name: Property Monitor

on:
  schedule:
    # Runs every 3 days at 9 PM Malaysia time (1 PM UTC)
    - cron: '0 13 */3 * *'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = scrape + notify + publish; diagnose = inspect site markup only'
        required: false
        type: choice
        options:
          - 'full'
          - 'diagnose'
        default: 'full'
      include_expired:
        description: 'Include expired auction listings'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || 'full' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: src/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt
        playwright install chromium --with-deps

    - name: Diagnose site markup
      if: env.MODE == 'diagnose'
      env:
        LELONGTIPS_EMAIL: ${{ secrets.LELONGTIPS_EMAIL }}
        LELONGTIPS_PASSWORD: ${{ secrets.LELONGTIPS_PASSWORD }}
        LELONGTIPS_COOKIE: ${{ secrets.LELONGTIPS_COOKIE }}
      run: python src/diagnose.py --pages 2 --dump-dir data/diagnostics

    - name: Upload diagnostic HTML
      if: env.MODE == 'diagnose'
      uses: actions/upload-artifact@v4
      with:
        name: site-html-${{ github.run_number }}
        path: data/diagnostics/
        retention-days: 7

    - name: Scrape & reprocess (monitor.py → reprocess.py)
      if: env.MODE == 'full'
      env:
        LELONGTIPS_EMAIL: ${{ secrets.LELONGTIPS_EMAIL }}
        LELONGTIPS_PASSWORD: ${{ secrets.LELONGTIPS_PASSWORD }}
        LELONGTIPS_COOKIE: ${{ secrets.LELONGTIPS_COOKIE }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}
        INCLUDE_EXPIRED: ${{ github.event.inputs.include_expired || 'true' }}
      run: |
        cd src
        python monitor.py

    # Geocoding is paused — re-enable when the map work resumes.
    # - name: Geocode new addresses
    #   run: python src/geocode.py
    #   continue-on-error: true

    - name: Extract scheme names (Gemini AI)
      if: env.MODE == 'full'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python src/extract_schemes.py
      continue-on-error: true

    - name: Generate dashboard
      if: env.MODE == 'full'
      run: python src/generate_page.py

    - name: Commit and push changes
      if: env.MODE == 'full'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/ docs/
        git diff --staged --quiet || git commit -m "Update property data - $(date '+%Y-%m-%d %H:%M:%S')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload monitoring report
      if: env.MODE == 'full'
      uses: actions/upload-artifact@v4
      with:
        name: property-report-${{ github.run_number }}
        path: data/reports/
        retention-days: 30
